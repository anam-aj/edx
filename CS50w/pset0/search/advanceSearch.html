<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Advance Search</title>
        <link rel="stylesheet" href="index.css">
    </head>

    <body>
        <form id="advanceSearch" action="https://google.com/search">
            <img class="logo" src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png" alt="Google Logo">
            
                <div class="">
                    <label>All of these words:</label>
                    <input type="text" name="as_q" autofocus>
                </div>

                <div>
                    <label>This exact word or phrase:</label>
                    <input type="text" name="as_epq">
                </div>

                <div>
                    <label>None of these words:</label>
                    <input type="text" name="as_eq">
                </div>

                <div>
                    <label>Site or domain:</label>
                    <input type="text" name="as_sitesearch">
                </div>
            
                <div class="button_block">
                    <input type="submit" value="Advance Search">
                </div>
            </div>
        </form>

        <div class="link">
            <a href="index.html">Google Search</a>
        </div>
        
    </body>
    
</html>
